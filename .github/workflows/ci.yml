name: CI
on:
  push:
  pull_request:
jobs:
  controller:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: node --check overlay/live2d.js
      - run: node --check scripts/install-live2d.mjs
# C# SMAPI compilation needs locally installed Stardew Valley game assemblies.
# No executable gameplay validation is claimed by this workflow.
